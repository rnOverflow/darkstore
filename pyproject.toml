[project]
name = "darkstore"
version = "0.1.0"
description = "Real-time quick-commerce order + ETA platform"
requires-python = ">=3.12,<3.13"
dependencies = ["darkstore-common", "darkstore-order", "darkstore-inventory", "darkstore-picking", "darkstore-dispatch", "darkstore-rider-sim", "darkstore-simulator", "darkstore-eta", "darkstore-gateway", "darkstore-ops-api"]

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.uv.sources]
darkstore-common = { workspace = true }
darkstore-order = { workspace = true }
darkstore-inventory = { workspace = true }
darkstore-picking = { workspace = true }
darkstore-dispatch = { workspace = true }
darkstore-rider-sim = { workspace = true }
darkstore-simulator = { workspace = true }
darkstore-eta = { workspace = true }
darkstore-gateway = { workspace = true }
darkstore-ops-api = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.4.0",
    "mlflow==3.17.2",   # experiment tracking client; keep equal to the server image in docker-compose.yml
    "ruff>=0.6",
    "testcontainers[kafka,postgres,redis]>=4.8",
    "locust>=2.47.0",
    "websocket-client>=1.9.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 120
markers = ["integration: needs docker (testcontainers)"]
testpaths = ["packages", "services", "tests"]

[tool.ruff]
line-length = 100
