[project]
name = "darkstore"
version = "0.1.0"
description = "Real-time quick-commerce order + ETA platform"
requires-python = ">=3.12,<3.13"
dependencies = ["darkstore-common"]

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.uv.sources]
darkstore-common = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["packages", "services", "tests"]

[tool.ruff]
line-length = 100
