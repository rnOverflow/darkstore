global: {scrape_interval: 10s, evaluation_interval: 10s}
rule_files: [/etc/prometheus/rules/*.yml]
scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
  - job_name: otel-collector
    honor_labels: true             # keep the app's own job/instance, do not overwrite with the collector's
    static_configs: [{targets: ["otel-collector:8889"]}]
  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs: [{targets: ["redpanda:9644"]}]
