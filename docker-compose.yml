name: darkstore

# Memory limits sized for a Docker VM with ~4 GB.
x-healthy: &hc
  interval: 5s
  timeout: 5s
  retries: 24
  start_period: 5s

# Environment shared by every Python service. It deliberately does NOT contain TOKEN_SECRET: only
# the services that sign or verify tokens (order, gateways, ops-api) receive it, so compromising the
# simulator or the ETA service cannot mint tracking/ops tokens.
x-app-env: &app-env
  KAFKA_BOOTSTRAP: redpanda:9092
  REDIS_URL: redis://:${REDIS_PASSWORD:?run make env to generate .env}@redis:6379/0
  SIM_START_HOUR: ${SIM_START_HOUR:-16}        # one shared simulated clock for every service
  OTEL_ENDPOINT: http://otel-collector:4318    # traces, metrics and logs (empty = telemetry off)
  OTEL_EXPORTER_OTLP_TIMEOUT: "3000"           # ms: a dead collector must not stall shutdown for long
  OTEL_ATTRIBUTE_VALUE_LENGTH_LIMIT: "256"      # no attribute can carry an oversized string

services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --overprovisioned
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr=internal://0.0.0.0:8082
      - --advertise-pandaproxy-addr=internal://redpanda:8082
      - --schema-registry-addr=0.0.0.0:8081
    ports: ["127.0.0.1:19092:19092", "127.0.0.1:8081:8081", "127.0.0.1:9644:9644"]
    mem_limit: 900m
    restart: unless-stopped
    volumes: [redpanda-data:/var/lib/redpanda/data]
    healthcheck:
      <<: *hc
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]

  # dev-sized broker: reserve 256 KiB (default 4 MiB) per partition so retry/DLQ topics fit.
  # (RP_BOOTSTRAP_* env vars are not honored by this image, so set it via the admin API.)
  redpanda-config:
    image: redpandadata/redpanda:v24.2.7
    # Also turns write caching OFF: dev-container mode enables it, so acks (even acks=all) precede fsync and a
    # kill -9 loses ~100 ms of acknowledged records (found by the broker-crash chaos run, ADR-0008).
    entrypoint: ["sh", "-c", "rpk -X admin.hosts=redpanda:9644 cluster config set topic_memory_per_partition 262144 && rpk -X admin.hosts=redpanda:9644 cluster config set write_caching_default false"]
    restart: "no"
    mem_limit: 128m
    depends_on:
      redpanda: {condition: service_healthy}

  console:
    image: redpandadata/console:v2.7.2
    environment:
      KAFKA_BROKERS: redpanda:9092
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: http://redpanda:8081
    ports: ["127.0.0.1:8080:8080"]
    mem_limit: 256m
    restart: unless-stopped
    depends_on:
      redpanda: {condition: service_healthy}

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-darkstore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make env to generate .env}
      POSTGRES_DB: ${POSTGRES_DB:-darkstore}
      PG_PASSWORD_ORDER: ${PG_PASSWORD_ORDER:?run make env to generate .env}
      PG_PASSWORD_INVENTORY: ${PG_PASSWORD_INVENTORY:?run make env to generate .env}
      PG_PASSWORD_PICKING: ${PG_PASSWORD_PICKING:?run make env to generate .env}
      PG_PASSWORD_DISPATCH: ${PG_PASSWORD_DISPATCH:?run make env to generate .env}
      PG_PASSWORD_RIDER_SIM: ${PG_PASSWORD_RIDER_SIM:?run make env to generate .env}
      PG_PASSWORD_ETA: ${PG_PASSWORD_ETA:?run make env to generate .env}
      PG_PASSWORD_GATEWAY: ${PG_PASSWORD_GATEWAY:?run make env to generate .env}
      PG_PASSWORD_OPS_API: ${PG_PASSWORD_OPS_API:?run make env to generate .env}
    ports: ["127.0.0.1:5433:5432"]
    mem_limit: 256m
    restart: unless-stopped
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./infra/postgres/init-roles.sh:/docker-entrypoint-initdb.d/init-roles.sh:ro
    healthcheck:
      <<: *hc
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-darkstore} -d ${POSTGRES_DB:-darkstore}"]

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?run make env to generate .env}
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb",
              "--requirepass", "${REDIS_PASSWORD:?run make env to generate .env}"]
    ports: ["127.0.0.1:6379:6379"]
    mem_limit: 192m
    restart: unless-stopped
    healthcheck:
      <<: *hc
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./infra/otel/config.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["127.0.0.1:4317:4317", "127.0.0.1:4318:4318", "127.0.0.1:13133:13133", "127.0.0.1:8889:8889"]
    mem_limit: 256m
    restart: unless-stopped
    depends_on: [tempo, loki]

  tempo:
    image: grafana/tempo:2.5.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes: ["./infra/tempo/tempo.yaml:/etc/tempo.yaml:ro", "tempo-data:/var/tempo"]
    ports: ["127.0.0.1:3200:3200"]
    mem_limit: 640m          # was 384m: OOM-killed (exit 137) while tracing a few hundred orders
    restart: unless-stopped  # losing the trace backend must not need a human on a laptop

  loki:
    image: grafana/loki:3.1.1
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes: ["./infra/loki/config.yaml:/etc/loki/config.yaml:ro", "loki-data:/loki"]
    ports: ["127.0.0.1:3100:3100"]
    mem_limit: 384m
    restart: unless-stopped
    healthcheck:
      <<: *hc
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready | grep -q ready"]

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
      - prom-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    mem_limit: 384m
    restart: unless-stopped
    healthcheck:
      <<: *hc
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready"]

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run make env to generate .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    mem_limit: 384m
    restart: unless-stopped
    depends_on: [prometheus, tempo, loki]
    healthcheck:
      <<: *hc
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q ok"]

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.2
    command: >
      mlflow server --host 0.0.0.0 --port 5000 --workers 1 --allowed-hosts "localhost:5001,127.0.0.1:5001,mlflow:5000,localhost:5000"
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --serve-artifacts --artifacts-destination /mlflow/artifacts
    volumes: [mlflow-data:/mlflow]
    ports: ["127.0.0.1:5001:5000"]
    mem_limit: 1g
    restart: unless-stopped
    healthcheck:
      <<: *hc
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:5000/health')\""]

  order:
    build: {context: ., target: app}
    image: darkstore-app:dev
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 200
    environment: {<<: *app-env, SERVICE: order, DATABASE_URL: "postgresql+asyncpg://svc_orders:${PG_PASSWORD_ORDER}@postgres:5432/${POSTGRES_DB:-darkstore}", HTTP_PORT: "8001", TOKEN_SECRET: "${TOKEN_SECRET:?run make env to generate .env}"}
    ports: ["127.0.0.1:8001:8001"]
    mem_limit: 192m
    restart: unless-stopped
    depends_on: &app-deps
      redpanda: {condition: service_healthy}
      redpanda-config: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      <<: *hc
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8001/healthz')\""]

  inventory:
    image: darkstore-app:dev
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 200
    environment: {<<: *app-env, SERVICE: inventory, DATABASE_URL: "postgresql+asyncpg://svc_inventory:${PG_PASSWORD_INVENTORY}@postgres:5432/${POSTGRES_DB:-darkstore}"}
    mem_limit: 192m
    restart: unless-stopped
    depends_on: {<<: *app-deps, order: {condition: service_healthy}}

  picking:
    image: darkstore-app:dev
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 200
    environment: {<<: *app-env, SERVICE: picking, DATABASE_URL: "postgresql+asyncpg://svc_picking:${PG_PASSWORD_PICKING}@postgres:5432/${POSTGRES_DB:-darkstore}", PICK_VARIABLE: "true"}
    mem_limit: 192m
    restart: unless-stopped
    depends_on: {<<: *app-deps, order: {condition: service_healthy}}

  dispatch:
    image: darkstore-app:dev
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 200
    environment: {<<: *app-env, SERVICE: dispatch, DATABASE_URL: "postgresql+asyncpg://svc_dispatch:${PG_PASSWORD_DISPATCH}@postgres:5432/${POSTGRES_DB:-darkstore}"}
    mem_limit: 192m
    restart: unless-stopped
    depends_on: {<<: *app-deps, order: {condition: service_healthy}}

  rider-sim:
    image: darkstore-app:dev
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 200
    environment: {<<: *app-env, SERVICE: rider_sim, DATABASE_URL: "postgresql+asyncpg://svc_rider_sim:${PG_PASSWORD_RIDER_SIM}@postgres:5432/${POSTGRES_DB:-darkstore}", RIDERS: "120", FLAKY_RATE: "0.05"}
    mem_limit: 192m
    restart: unless-stopped
    depends_on: {<<: *app-deps, order: {condition: service_healthy}}

  simulator:
    image: darkstore-app:dev
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 200
    environment: {<<: *app-env, SERVICE: simulator, ORDER_API_URL: http://order:8001, SIM_ORDERS_PER_MINUTE: "${SIM_ORDERS_PER_MINUTE:-1}"}
    mem_limit: 192m
    restart: unless-stopped
    profiles: [demo]
    depends_on: {<<: *app-deps, order: {condition: service_healthy}}

  eta:
    image: darkstore-app:dev
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 200
    environment: {<<: *app-env, SERVICE: eta, DATABASE_URL: "postgresql+asyncpg://svc_eta:${PG_PASSWORD_ETA}@postgres:5432/${POSTGRES_DB:-darkstore}", ETA_MODEL_DIR: /app/models/eta/current}
    volumes: ["./models:/app/models:ro"]   # model bundles are pickles: mount only what you trust
    mem_limit: 512m
    restart: unless-stopped
    depends_on: {<<: *app-deps, order: {condition: service_healthy}}

  gateway-1:
    image: darkstore-app:dev
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 200
    environment: {<<: *app-env, SERVICE: gateway, DATABASE_URL: "postgresql+asyncpg://svc_gateway:${PG_PASSWORD_GATEWAY}@postgres:5432/${POSTGRES_DB:-darkstore}", HTTP_PORT: "8002", TOKEN_SECRET: "${TOKEN_SECRET:?run make env to generate .env}", WS_ALLOWED_ORIGINS: '["http://localhost:8088"]'}
    mem_limit: 192m
    restart: unless-stopped
    depends_on: {<<: *app-deps, order: {condition: service_healthy}}
    healthcheck:
      <<: *hc
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8002/healthz')\""]

  gateway-2:
    image: darkstore-app:dev
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 200
    environment: {<<: *app-env, SERVICE: gateway, DATABASE_URL: "postgresql+asyncpg://svc_gateway:${PG_PASSWORD_GATEWAY}@postgres:5432/${POSTGRES_DB:-darkstore}", HTTP_PORT: "8002", TOKEN_SECRET: "${TOKEN_SECRET:?run make env to generate .env}", WS_ALLOWED_ORIGINS: '["http://localhost:8088"]'}
    mem_limit: 192m
    restart: unless-stopped
    depends_on: {<<: *app-deps, order: {condition: service_healthy}}
    healthcheck:
      <<: *hc
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8002/healthz')\""]

  ops-api:
    image: darkstore-app:dev
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 200
    environment: {<<: *app-env, SERVICE: ops_api, DATABASE_URL: "postgresql+asyncpg://svc_ops_api:${PG_PASSWORD_OPS_API}@postgres:5432/${POSTGRES_DB:-darkstore}", HTTP_PORT: "8003", TOKEN_SECRET: "${TOKEN_SECRET:?run make env to generate .env}"}
    mem_limit: 192m
    restart: unless-stopped
    depends_on: {<<: *app-deps, order: {condition: service_healthy}}
    healthcheck:
      <<: *hc
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8003/healthz')\""]

  # One-shot tooling, not part of the stack: `make train` / `make retrain` run it (profile "tools").
  # Output goes to ./models, ./data and ./docs/ml, written as the host user (see Makefile).
  trainer:
    build: {context: ., target: trainer}
    image: darkstore-trainer:dev
    profiles: [tools]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    working_dir: /work
    environment: {MLFLOW_TRACKING_URI: "http://mlflow:5000", HOME: /tmp}
    volumes: ["./models:/work/models", "./data:/work/data", "./docs/ml:/work/docs/ml"]
    mem_limit: 2g
    depends_on: {mlflow: {condition: service_healthy}}

  web:
    build: {context: ., dockerfile: web/Dockerfile}   # React apps built in the image; nginx.conf baked in
    image: darkstore-web:dev
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    ports: ["127.0.0.1:8088:80"]
    mem_limit: 64m
    restart: unless-stopped
    depends_on:
      gateway-1: {condition: service_healthy}
      gateway-2: {condition: service_healthy}
      ops-api: {condition: service_healthy}
      order: {condition: service_healthy}

volumes:
  redpanda-data:
  pg-data:
  tempo-data:
  loki-data:
  prom-data:
  grafana-data:
  mlflow-data:
