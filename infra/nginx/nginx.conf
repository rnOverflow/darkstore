# One origin for everything: static UIs, WebSocket gateway (2 replicas), REST.
worker_processes 1;
events { worker_connections 4096; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on;
  server_tokens off;

  # order creation is unauthenticated until P7: cap it per client IP
  limit_req_zone $binary_remote_addr zone=orders:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  limit_conn_zone $binary_remote_addr zone=wsconn:10m;
  limit_req_status 429;
  limit_conn_status 429;
  client_max_body_size 16k;                   # every request body here is a small JSON document
  client_body_timeout 10s;
  client_header_timeout 10s;
  keepalive_timeout 30s;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  upstream gateways {
    server gateway-1:8002 max_fails=1 fail_timeout=5s;
    server gateway-2:8002 max_fails=1 fail_timeout=5s;
  }

  server {
    listen 80;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://tile.openstreetmap.org; connect-src 'self' https://tile.openstreetmap.org; worker-src 'self' blob:; child-src blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors 'none'" always;

    location /ops/ { try_files $uri $uri/ /ops/index.html; }
    location /      { try_files $uri $uri/ /index.html; }

    location /ws {
      limit_conn wsconn 20;                   # per client IP
      proxy_pass http://gateways;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
      proxy_next_upstream error timeout;      # a dead replica: the client's reconnect lands on the other
    }
    location /api/orders {
      limit_req zone=orders burst=40 nodelay;
      proxy_pass http://order:8001/orders;    # /api/orders/x -> /orders/x
    }
    location /api/ops/ {
      limit_req zone=api burst=60 nodelay;
      proxy_pass http://ops-api:8003;
    }
    location = /api/city {
      limit_req zone=api burst=60 nodelay;
      proxy_pass http://ops-api:8003;
    }
  }
}
