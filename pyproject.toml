[project]
name = "darkstore"
version = "0.1.0"
description = "Real-time quick-commerce order + ETA platform"
requires-python = ">=3.12,<3.13"
dependencies = ["darkstore-common", "darkstore-order", "darkstore-inventory", "darkstore-picking"]

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.uv.sources]
darkstore-common = { workspace = true }
darkstore-order = { workspace = true }
darkstore-inventory = { workspace = true }
darkstore-picking = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.4.0",
    "ruff>=0.6",
    "testcontainers[kafka,postgres,redis]>=4.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 120
markers = ["integration: needs docker (testcontainers)"]
testpaths = ["packages", "services", "tests"]

[tool.ruff]
line-length = 100
