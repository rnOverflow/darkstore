receivers:
  otlp:
    protocols:
      grpc: {endpoint: 0.0.0.0:4317}
      http: {endpoint: 0.0.0.0:4318}
processors:
  batch: {}
  memory_limiter:
    check_interval: 1s
    limit_mib: 200
extensions:
  health_check: {endpoint: 0.0.0.0:13133}
exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls: {insecure: true}
  prometheus:
    endpoint: 0.0.0.0:8889
    metric_expiration: 2m          # a stopped replica's series disappear instead of going stale forever
    resource_to_telemetry_conversion: {enabled: true}   # service.name -> service_name label
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
service:
  extensions: [health_check]
  pipelines:
    traces:  {receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlp/tempo]}
    metrics: {receivers: [otlp], processors: [memory_limiter, batch], exporters: [prometheus]}
    logs:    {receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlphttp/loki]}
